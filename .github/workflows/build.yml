name: Build firmware

on:
  push:
    branches: ['**']
    tags: ['Release_v*']
  pull_request:
  workflow_dispatch:
    inputs:
      no_ccache:
        description: 'Disable ccache (compile everything from scratch)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Everything that needs no Teensy toolchain. Independent of `build`, so a
  # compile failure still reports the test results and vice versa.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # Unpinned on purpose: tools/check-pins.mjs tracks the ACME pin sites and
      # reads this file for others, so a version named here would drift
      # silently. build-c64.test.mjs byte-compares the headers, which is the
      # check that a version string could not make.
      - name: Install ACME
        run: |
          sudo apt-get update
          sudo apt-get install -y acme
          acme --version

      - name: Run tool tests
        run: npm test

      - name: Run extension loader conformance suite
        run: npm run verify:extensions

      - name: Run bench tests
        run: python3 -m unittest discover -s tools/bench

  # TR and TR+ build in parallel; `collect` gathers both hex files into one artifact.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [tr, tr-plus]
    env:
      # Release tags always build without ccache, so published hex files come from a clean
      # compile, and so does a manual run with "Disable ccache" checked. Everything else
      # reuses compiled objects from earlier runs. (inputs.no_ccache is null outside manual runs.)
      USE_CCACHE: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.no_ccache }}
    steps:
      - uses: actions/checkout@v7

      - name: Reject npm dependencies
        run: |
          if node -e "const p=require('./package.json'); process.exit((p.dependencies||p.devDependencies)?1:0)"; then
            echo "package.json has no dependencies field, as required"
          else
            echo "::error::package.json declares dependencies/devDependencies; this build path is zero-dependency Node only"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install arduino-cli
        run: |
          CLI=$(node tools/install-arduino-cli.mjs)
          echo "Resolved arduino-cli: $CLI"
          if [ "$CLI" != "arduino-cli" ]; then
            dirname "$CLI" >> "$GITHUB_PATH"
          fi

      - name: Install Teensy core 1.61.0
        run: |
          arduino-cli config init --additional-urls https://www.pjrc.com/teensy/package_teensy_index.json
          arduino-cli core update-index
          arduino-cli core install teensy:avr@1.61.0
          arduino-cli lib install CRC32@2.0.1

      # Third-party action, so pinned to a full commit SHA rather than a movable tag.
      - name: Set up ccache
        if: env.USE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          # The action restores the newest cache whose key starts with "ccache-<key>-", so
          # a bare "tr" would also match (and restore) tr-plus caches. The suffix keeps them apart.
          key: ${{ matrix.target }}-firmware
          # The action's own checksum-verified ccache build: faster than apt (8-16 s), and new
          # enough (4.10+) for the job-summary stats.
          install: binary
          # Drop anything this run didn't use, so the cache tracks the current tree
          # instead of growing with every past revision.
          evict-old-files: job

      - name: Build ${{ matrix.target }}
        run: npm run build:${{ matrix.target }} -- ${{ env.USE_CCACHE == 'true' && '--ccache' || '' }}

      # The extension loader ships with the TR+ and not with the TR, and neither hex says
      # so in its name. build-host-package.mjs reads the extension slot out of the hex, so
      # it answers the question directly: it packages a host from the TR+ build and refuses
      # the TR build for carrying nothing there. A build that silently came out the other
      # way round -- a TR+ without the loader, a TR with it -- fails here rather than on
      # someone's cartridge.
      - name: Check the loader is in the ${{ matrix.target }} image, or is not
        run: |
          hex=$(ls build/firmware/*.hex)
          echo "checking $hex"
          if [ "${{ matrix.target }}" = "tr-plus" ]; then
            node tools/build-host-package.mjs --hex "$hex" --out build/firmware/host.TRH
          else
            if node tools/build-host-package.mjs --hex "$hex" --out /dev/null; then
              echo "::error::the plain TR image carries an extension host; it has no DMA to run one"
              exit 1
            fi
            echo "no extension slot content, as expected for --target tr"
          fi

      # Source/Teensy/ExampleHost is the third-party host story, and nothing else in the
      # build compiles it: docs/Architecture/Extension-Hosts.md promises a reader that it
      # builds, and the globals it has to define come from sibling sources that are free
      # to change. Build it here so that promise fails in CI rather than in someone's
      # first attempt at a host. Extension image only -- the other two are the same ones
      # the step above already built.
      - name: Build the example third-party host
        if: matrix.target == 'tr-plus'
        run: |
          npm run build:example-host -- --yes --force --keep-work \
            --skip-minimal-build --skip-teensy-build --skip-combine
          hex=$(ls -t build/firmware/run-*/extension/ExampleHost.ino.hex | head -1)
          node tools/build-host-package.mjs --hex "$hex" --out build/firmware/EXAMPLE.TRH \
            | tee /tmp/example-host.txt
          # The descriptor is what the menu names the host by, and it is the one thing
          # packaging cannot check for itself. A host that built but published someone
          # else's identity would otherwise pass this step.
          grep -q 'Host "Example"' /tmp/example-host.txt

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}
          path: |
            build/firmware/*.hex
            build/firmware/*.TRH

  collect:
    needs: [build, tools]
    runs-on: ubuntu-latest
    # contents: write is needed only for the tag-push publish step below (a manual run on a
    # tag builds but never publishes); the repo's default workflow token is read-only, so
    # this has to be requested explicitly here.
    permissions:
      contents: write
    steps:
      - name: Merge firmware artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: firmware
          pattern: firmware-*
          delete-merged: true

      - uses: actions/download-artifact@v8
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/Release_v')
        with:
          name: firmware
          path: build/firmware

      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/Release_v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/firmware/*.hex
