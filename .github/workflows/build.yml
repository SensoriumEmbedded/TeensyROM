name: Build firmware

on:
  push:
    branches: ['**']
    tags: ['Release_v*']
  pull_request:
  workflow_dispatch:
    inputs:
      no_ccache:
        description: 'Disable ccache (compile everything from scratch)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Everything that needs no Teensy toolchain. Independent of `build`, so a
  # compile failure still reports the test results and vice versa.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # Unpinned on purpose: tools/check-pins.mjs tracks the ACME pin sites and
      # reads this file for others, so a version named here would drift
      # silently. build-c64.test.mjs byte-compares the headers, which is the
      # check that a version string could not make.
      - name: Install ACME
        run: |
          sudo apt-get update
          sudo apt-get install -y acme
          acme --version

      - name: Run tool tests
        run: npm test

      - name: Run extension loader conformance suite
        run: npm run verify:extensions

      - name: Run bench tests
        run: python3 -m unittest discover -s tools/bench

  # TR and TR+ build in parallel; `collect` gathers both hex files into one artifact.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [tr, tr-plus]
    env:
      # Release tags always build without ccache, so published hex files come from a clean
      # compile, and so does a manual run with "Disable ccache" checked. Everything else
      # reuses compiled objects from earlier runs. (inputs.no_ccache is null outside manual runs.)
      USE_CCACHE: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.no_ccache }}
    steps:
      - uses: actions/checkout@v7

      - name: Reject npm dependencies
        run: |
          if node -e "const p=require('./package.json'); process.exit((p.dependencies||p.devDependencies)?1:0)"; then
            echo "package.json has no dependencies field, as required"
          else
            echo "::error::package.json declares dependencies/devDependencies; this build path is zero-dependency Node only"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install arduino-cli
        run: |
          CLI=$(node tools/install-arduino-cli.mjs)
          echo "Resolved arduino-cli: $CLI"
          if [ "$CLI" != "arduino-cli" ]; then
            dirname "$CLI" >> "$GITHUB_PATH"
          fi

      - name: Install Teensy core 1.61.0
        run: |
          arduino-cli config init --additional-urls https://www.pjrc.com/teensy/package_teensy_index.json
          arduino-cli core update-index
          arduino-cli core install teensy:avr@1.61.0
          arduino-cli lib install CRC32@2.0.1

      # Third-party action, so pinned to a full commit SHA rather than a movable tag.
      - name: Set up ccache
        if: env.USE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          # The action restores the newest cache whose key starts with "ccache-<key>-", so
          # a bare "tr" would also match (and restore) tr-plus caches. The suffix keeps them apart.
          key: ${{ matrix.target }}-firmware
          # The action's own checksum-verified ccache build: faster than apt (8-16 s), and new
          # enough (4.10+) for the job-summary stats.
          install: binary
          # Drop anything this run didn't use, so the cache tracks the current tree
          # instead of growing with every past revision.
          evict-old-files: job

      - name: Build ${{ matrix.target }}
        run: npm run build:${{ matrix.target }} -- ${{ env.USE_CCACHE == 'true' && '--ccache' || '' }}

      # No firmware hex carries an extension host: a host is installed onto a board, never
      # shipped inside its firmware. The hex is decoded and every byte in it must sit below
      # the slot, rather than asking build-host-package.mjs to package one and reading its
      # refusal as success -- that exits 1 for a slot holding a host it cannot package,
      # too, which is exactly the hex this step exists to catch. The TR+ build packages the
      # stock host beside its hex instead -- and builds it only when the loader is compiled
      # in -- so exactly one .TRH there, and none beside the TR, is what a TR+ that lost
      # the loader or a TR that gained it would break.
      - name: Check the ${{ matrix.target }} hex carries no host, and what sits beside it
        shell: bash
        run: |
          shopt -s nullglob
          hexes=(build/firmware/*.hex)
          packages=(build/firmware/*.TRH)
          if [ ${#hexes[@]} -ne 1 ]; then
            echo "::error::expected one firmware hex, found ${#hexes[@]}: ${hexes[*]}"
            exit 1
          fi
          echo "checking ${hexes[0]}"
          node --input-type=module -e '
            import fs from "node:fs";
            import { decodeHex, VM_BASE } from "./tools/lib/hex.mjs";
            let top = 0;
            for (const address of decodeHex(fs.readFileSync(process.argv[1], "utf8")).keys()) {
              if (address > top) top = address;
            }
            if (top >= VM_BASE) {
              console.log(`::error::the firmware hex reaches 0x${top.toString(16)}, into the extension slot at 0x${VM_BASE.toString(16)}; hosts ship as .TRH packages`);
              process.exit(1);
            }
            console.log(`hex tops out at 0x${top.toString(16)}, below the slot`);
          ' "${hexes[0]}"
          expected=0
          if [ "${{ matrix.target }}" = "tr-plus" ]; then expected=1; fi
          if [ ${#packages[@]} -ne $expected ]; then
            echo "::error::expected $expected host package(s) beside the ${{ matrix.target }} hex, found ${#packages[@]}: ${packages[*]}"
            exit 1
          fi
          echo "no host in the hex; ${#packages[@]} host package(s) beside it, as expected"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}
          path: |
            build/firmware/*.hex
            build/firmware/*.TRH

      # Source/Teensy/ExampleHost is the third-party host story, and nothing else in the
      # build compiles it: docs/Architecture/Extension-Hosts.md promises a reader that it
      # builds, and the globals it has to define come from sibling sources that are free
      # to change. Build it here so that promise fails in CI rather than in someone's
      # first attempt at a host. --ccache is passed under that step's condition so
      # this compile can reuse the same cache; without it the extension image is a full
      # cold compile on every run.
      #
      # After the upload rather than before, for two separate reasons. A stale doc should
      # fail the run without also costing it the firmware it did build, which an earlier
      # step would, since the upload never runs. And the example's .TRH is a host that
      # does nothing on purpose: shipped in the artifact beside the stock host it is
      # something a reader can copy to a card and install over a working extension slot.
      # A --host-sketch build compiles the host alone, so this costs one image, not three;
      # it keeps build/firmware as its --out so --ccache finds the same build root.
      - name: Build the example third-party host
        if: matrix.target == 'tr-plus'
        # Named explicitly to get -o pipefail, which the default `bash -e` run shell does
        # not set. Nothing below pipes, which is the point: this step used to package
        # through `tee`, and a pipeline reports its last command's status, so a failed
        # packaging could be stepped over. The pipe is gone and the guard stays, so the
        # next one added here cannot hide a failure either.
        shell: bash
        run: |
          built=$(npm run build:example-host -- \
            ${{ env.USE_CCACHE == 'true' && '--ccache' || '' }})
          echo "$built"
          # The descriptor is what the menu names the host by, and it is the one thing
          # packaging cannot check for itself. A host that built but published someone
          # else's identity would otherwise pass this step.
          grep -q 'Host "Example"' <<<"$built"

  collect:
    needs: [build, tools]
    runs-on: ubuntu-latest
    # contents: write is needed only for the tag-push publish step below (a manual run on a
    # tag builds but never publishes); the repo's default workflow token is read-only, so
    # this has to be requested explicitly here.
    permissions:
      contents: write
    steps:
      - name: Merge firmware artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: firmware
          pattern: firmware-*
          delete-merged: true

      - uses: actions/download-artifact@v8
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/Release_v')
        with:
          name: firmware
          path: build/firmware

      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/Release_v')
        uses: softprops/action-gh-release@v3
        with:
          # The firmware only. The stock host's .TRH is in the build artifact for anyone
          # testing modules, but a release does not offer an extension host until there is
          # a module a user would install it for.
          files: build/firmware/*.hex
