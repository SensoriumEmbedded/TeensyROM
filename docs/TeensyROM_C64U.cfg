; TeensyROM settings for a Commodore 64 Ultimate (C64U) or an Ultimate 64
;
; Hands the cartridge port to the TeensyROM and moves the C64U's own devices
; out of $DE00-$DFFF, where the TeensyROM answers.
;
; To use: copy this file to a USB drive in the C64U, select it in the C64U's
; file browser and choose "Load Settings". When you leave the C64U's menu, it
; asks whether to save the changes to flash: answer yes. Then power the C64U
; off and on.
;
; SIDs: Socket 1 and UltiSID 1 go to $D400, Socket 2 and UltiSID 2 to $D420.
; The Range Split settings are left alone, so an 8-SID split keeps working.
; Cynthcart's second SID needs $DF00: set "UltiSID 2 Address" to $DF00 by hand
; while using it, then load this file again to move it back.
;
; Details: https://github.com/SensoriumEmbedded/TeensyROM/blob/main/docs/C64_Ultimate_Enhancements.md

[C64 and Cartridge Settings]
Cartridge Preference=External
Bus Operation Mode=Writes
RAM Expansion Unit=Disabled
Command Interface=Disabled
Map Ultimate Audio $DF20-DFFF=Disabled

[Modem Settings]
ACIA (6551) Mapping=Off

[SID Addressing]
SID Socket 1 Address=$D400
SID Socket 2 Address=$D420
UltiSID 1 Address=$D400
UltiSID 2 Address=$D420
